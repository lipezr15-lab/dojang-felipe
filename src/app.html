<title>Dojang de Bolso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Saira+Condensed:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#EFF3F9; --surface:#FFFFFF; --surface-2:#E6EDF6; --line:#D5DEEB; --line-soft:#E7EDF6;
  --ink:#0F1B2D; --ink-2:#43536B; --ink-3:#71829B;
  --accent:#1D5CB8; --accent-2:#3E82DF; --accent-soft:#E3ECFA; --on-accent:#FFFFFF;
  --red:#BE1F2D; --red-soft:#FBE5E7;
  --pine:#2C7256; --pine-soft:#DFF0E8;
  --gold:#A8781F; --gold-soft:#F7EEDA;
  --shadow:0 1px 2px rgba(15,27,45,.05), 0 10px 26px -16px rgba(15,27,45,.30);
  --shadow-lift:0 2px 4px rgba(15,27,45,.06), 0 18px 34px -20px rgba(15,27,45,.40);
  --r:14px; --r-sm:9px; --r-lg:20px;
  --nav-h:64px;
  --display:"Saira Condensed","Arial Narrow",Helvetica,sans-serif;
  --body:"Asap","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A101B; --surface:#141F31; --surface-2:#1C2A3F; --line:#2A3A52; --line-soft:#213048;
    --ink:#E9F0F9; --ink-2:#AFC0D6; --ink-3:#8497B1;
    --accent:#5A9BF2; --accent-2:#7FB4F7; --accent-soft:#16294A; --on-accent:#08121F;
    --red:#F0666E; --red-soft:#3A1A20;
    --pine:#4FB98A; --pine-soft:#123124;
    --gold:#DDB259; --gold-soft:#332916;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 34px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0A101B; --surface:#141F31; --surface-2:#1C2A3F; --line:#2A3A52; --line-soft:#213048;
  --ink:#E9F0F9; --ink-2:#AFC0D6; --ink-3:#8497B1;
  --accent:#5A9BF2; --accent-2:#7FB4F7; --accent-soft:#16294A; --on-accent:#08121F;
  --red:#F0666E; --red-soft:#3A1A20;
  --pine:#4FB98A; --pine-soft:#123124;
  --gold:#DDB259; --gold-soft:#332916;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 34px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent-2);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-family:var(--display);text-wrap:balance;line-height:1.05;letter-spacing:-.01em}

.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* ---------- topo ---------- */
.top{
  position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line-soft);
  padding-top:env(safe-area-inset-top,0px);
}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 0 11px}
.who{flex:1;min-width:0}
.who .hi{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.who .nm{font-family:var(--display);font-size:27px;font-weight:800;text-transform:uppercase;letter-spacing:.005em}
.streak{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:56px;padding:5px 9px;border-radius:var(--r-sm);
  background:var(--red-soft);color:var(--red);
}
.streak b{font-family:var(--display);font-size:22px;font-weight:800;line-height:1}
.streak span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.streak.off{background:var(--surface-2);color:var(--ink-3)}

/* faixa desenhada */
.belt{display:flex;align-items:center;gap:9px;padding:8px 0 12px}
.belt-band{
  flex:1;height:17px;border-radius:3px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(15,27,45,.22), inset 0 -5px 9px -6px rgba(0,0,0,.55);
}
.belt-band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(0,0,0,.12))}
.belt-stripe{position:absolute;right:9px;top:0;bottom:0;width:13px;background:#15171C;z-index:2;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.belt-label{font-family:var(--display);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;color:var(--ink-2)}

/* ---------- blocos ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.eyebrow{
  font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.h-sec{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.kor{font-style:italic;color:var(--accent);font-weight:600}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 16px;border-radius:var(--r-sm);font-weight:600;font-size:15px;
  background:var(--surface-2);color:var(--ink);border:1px solid transparent;transition:transform .07s;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow)}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn-block{width:100%}
.btn-lg{padding:16px;font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:100px;
  font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--surface-2);color:var(--ink-2);
}
.chip-blue{background:var(--accent-soft);color:var(--accent)}
.chip-pine{background:var(--pine-soft);color:var(--pine)}
.chip-red{background:var(--red-soft);color:var(--red)}
.chip-gold{background:var(--gold-soft);color:var(--gold)}

/* hoje */
.hero{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lift);padding:16px;position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:var(--accent-soft);opacity:.75;
}
.hero>*{position:relative}
.hero .lead{font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;line-height:.98;margin:6px 0 4px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:10px 8px;text-align:center}
.tile b{display:block;font-family:var(--display);font-size:25px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-top:3px}

/* listas */
.item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:12px 13px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);
}
.item+.item{margin-top:7px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:15px}
.item .t small{display:block;color:var(--ink-3);font-size:12.5px}
.item .go{color:var(--ink-3);font-size:19px;line-height:1}
.item.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}

.badge-n{
  width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:17px;background:var(--surface-2);color:var(--ink-2);
}

/* checklist */
.chk{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line-soft)}
.chk:last-child{border-bottom:none}
.chk .box{
  width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--line);
  display:grid;place-items:center;font-size:13px;color:transparent;margin-top:1px;
}
.chk.done .box{background:var(--pine);border-color:var(--pine);color:#fff}
.chk.done .lb{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.chk .lb{font-size:14.5px;line-height:1.35}

/* contador */
.counter{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:var(--r-sm);padding:8px}
.counter b{flex:1;text-align:center;font-family:var(--display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.counter .cb{width:46px;height:46px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:24px;font-family:var(--display);font-weight:700;border:1px solid var(--line-soft)}
.counter .cb.plus{background:var(--accent);color:var(--on-accent);border-color:transparent}

/* cronômetro */
.clock{
  font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;
  font-size:76px;line-height:.92;letter-spacing:-.02em;text-align:center;
}
.clock.work{color:var(--ink)}
.clock.rest{color:var(--pine)}
.clock.warn{color:var(--red)}
.bar{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:100px;transition:width .25s linear}
.bar.rest>i{background:var(--pine)}

/* segmentos */
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* escada de faixas */
.ladder{display:flex;flex-direction:column;gap:0}
.rung{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
.rung:last-child{border-bottom:none}
.rung .sw{width:40px;height:13px;border-radius:3px;flex:none;position:relative;box-shadow:inset 0 0 0 1px rgba(15,27,45,.25)}
.rung .nm{flex:1;min-width:0}
.rung .nm b{font-weight:600;font-size:14.5px;display:block}
.rung .nm small{color:var(--ink-3);font-size:12px}
.rung .no{font-family:var(--display);font-weight:700;color:var(--ink-3);font-size:13px;width:20px;font-variant-numeric:tabular-nums}
.rung.past .nm b{color:var(--ink-3)}
.rung.cur{background:var(--accent-soft);border-radius:8px;padding:9px 8px;border-bottom-color:transparent}
.rung.cur .nm b{color:var(--accent)}

/* barras do diário */
.spark{display:flex;align-items:flex-end;gap:3px;height:58px}
.spark .b{flex:1;background:var(--surface-2);border-radius:3px 3px 0 0;min-height:3px;position:relative}
.spark .b.has{background:var(--accent)}
.spark-x{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);margin-top:5px}

/* quiz */
.opt{width:100%;text-align:left;padding:13px;border-radius:var(--r-sm);background:var(--surface);border:1.5px solid var(--line);font-size:15px;font-weight:500}
.opt.ok{border-color:var(--pine);background:var(--pine-soft);color:var(--pine);font-weight:700}
.opt.no{border-color:var(--red);background:var(--red-soft);color:var(--red)}

textarea,input[type=text]{
  width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:10px;resize:vertical;
}

/* tira de quadros do movimento */
.tira{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.quadro{background:var(--surface-2);border-radius:10px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.qlb{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.palco{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 4px}
.mini{width:86px;flex:none;background:var(--surface-2);border-radius:9px;padding:4px 2px}

/* player de video embutido */
.vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0b0d12;display:block;border:none;padding:0}
.vid img{width:100%;height:100%;object-fit:cover;display:block}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vid .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
.vid .play i{width:58px;height:40px;border-radius:10px;background:rgba(190,31,45,.94);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px;padding-left:3px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.vid-btn{position:absolute;inset:0;width:100%;height:100%;border:none;padding:0;background:none;display:block;cursor:pointer}
.vid-fora{font-size:12px;color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--line)}

/* nav inferior */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3)}
.nav button .ic{font-size:19px;line-height:1}
.nav button .lb{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.nav button.on{color:var(--accent)}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-weight:600;font-size:13.5px;padding:4px 0}

.note{background:var(--gold-soft);color:var(--gold);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;line-height:1.45;font-weight:500}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(8,14,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:640px;background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}

.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){ .tiles{gap:10px} body{font-size:15.5px} }
</style>

<header class="top">
  <div class="wrap">
    <div class="top-in">
      <div class="who">
        <div class="hi" id="greet">Bom treino</div>
        <div class="nm" id="uname">Felipe</div>
      </div>
      <button class="streak" id="streakBox" aria-label="Sequência de treinos">
        <b id="streakN">0</b><span>dias</span>
      </button>
    </div>
    <button class="belt" id="beltBtn" style="width:100%">
      <span class="belt-band" id="beltBand"><i class="belt-stripe" id="beltStripe"></i></span>
      <span class="belt-label" id="beltLabel">Azul decidida</span>
    </button>
  </div>
</header>

<main class="wrap" id="view" style="padding-top:14px"></main>

<nav class="nav">
  <div class="nav-in" id="nav"></div>
</nav>

<script>
/* ============================ CONTEÚDO ============================ */

const BELTS = [

function load(){
  try{

  }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}

const hoje = ()=> new Date().toISOString().slice(0,10);
const diaBR = d => { const [y,m,dd]=d.split('-'); return dd+'/'+m; };
const mmss = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

function streak(){
  if(!S.sessoes.length) return 0;
  const dias = new Set(S.sessoes.map(s=>s.d));
  let n=0; const d=new Date();
  if(!dias.has(hoje())) d.setDate(d.getDate()-1);
  for(;;){
    const k=d.toISOString().slice(0,10);
    if(dias.has(k)){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}
function totalReps(){ return Object.values(S.reps).reduce((a,b)=>a+b,0) + Object.values(S.armaReps).reduce((a,b)=>a+b,0); }
function minSemana(){
  const lim=new Date(); lim.setDate(lim.getDate()-6);
  const k=lim.toISOString().slice(0,10);
  return S.sessoes.filter(s=>s.d>=k).reduce((a,s)=>a+s.min,0);
}
function registrar(min, tags){
  S.sessoes.push({d:hoje(), min:Math.max(1,Math.round(min)), t:tags||[]});
  if(S.sessoes.length>400) S.sessoes = S.sessoes.slice(-400);
  save();
}
const beltAtual = ()=> BELTS[S.beltIdx];
function proxima(){
  if(S.nivel==='recomendada') return {b:BELTS[S.beltIdx], n:'decidida'};
  return S.beltIdx<BELTS.length-1 ? {b:BELTS[S.beltIdx+1], n:'recomendada'} : null;
}

let AC=null, wake=null;
function beep(freq, dur, vol){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=freq||880;
    g.gain.setValueAtTime(vol||0.22, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+(dur||0.18));
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+(dur||0.18));
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(60); }catch(e){}
}
async function segurarTela(on){
  try{
    if(on && 'wakeLock' in navigator && !wake) wake = await navigator.wakeLock.request('screen');
    if(!on && wake){ wake.release(); wake=null; }
  }catch(e){ wake=null; }
}

    const passos = m>=45?PROTOCOLO: m>=30?PROTOCOLO.slice(0,5):PROTOCOLO.slice(0,3);
    return passos.map(p=>({t:forma+' — '+p.n, s:p.d.indexOf('2')>=0?130:85, d:p.why, tag:'forma'}));
  },
  sombra: (m)=>{

    return [
      {t:'Trabalho de pés', s:75, d:'Salto leve com a guarda alta, entrando e saindo da distância.', tag:'sparring'},
      {t:'Combinação: '+c.n, s:m>=45?120:100, d:c.s+' — '+c.why, tag:'sparring'},
      {t:'Luta de sombra', s:m>=45?120:100, d:'Imagina um adversário da sua altura. Toca, sai, volta.', tag:'sparring'}
    ];
  },
  arma: (m)=>[{t:'Arma — drills de manuseio', s:300, d:'Escolha uma arma na aba Armas e faça os drills devagar, olhando para onde a ponta vai.', tag:'armas'}],
  condi: (m)=>{
    const base = [
      {t:'Abdominal', s:40, d:'Sem puxar o pescoço.'},
      {t:'Prancha', s:m>=45?45:30, d:'Bumbum na linha das costas.'},
      {t:'Agachamento', s:40, d:'Calcanhar no chão o tempo todo.'}
    ];
    if(m>=30) base.push({t:'Flexão', s:40, d:'Pode apoiar o joelho, mas desce até o peito quase tocar.'});
    return base;
  },
  calma: ()=>[
    {t:'Alongar pernas e quadril', s:90, d:'Segura cada posição 20s, respirando fundo.'},
    {t:'Respiração e cumprimento', s:30, d:'Quatro respirações lentas. Kyeong-ye.'}
  ]
};

function montarSessao(min){
  const forma = beltAtual().forma;
  let steps = [];
  steps = steps.concat(BLOCOS.aquece(min).slice(0, min<=15?3:5));
  steps = steps.concat(BLOCOS.chutes(min));
  steps = steps.concat(BLOCOS.forma(min, forma));
  if(min>=30) steps = steps.concat(BLOCOS.sombra(min));
  if(min>=45) steps = steps.concat(BLOCOS.arma(min));
  steps = steps.concat(BLOCOS.condi(min));
  steps = steps.concat(BLOCOS.calma().slice(0, min<=15?1:2));
  return steps;
}

AFTER.treino = ()=>{
  el.querySelectorAll('[data-sess]').forEach(b=>b.onclick=()=>{
    const m = +b.dataset.sess;
    const steps = montarSessao(m);
    sess = {min:m, steps, i:0, left:steps[0].s, run:true, gasto:0};
    beep(660,.12); segurarTela(true);
    render(); tick();
  });
  const sair = document.getElementById('sairSess');
  if(sair) sair.onclick = ()=>{
    if(sess && sess.gasto>60) registrar(sess.gasto/60, ['treino']);
    sess=null; pararTimer(); go('hoje');
  };
  const tgl = document.getElementById('tgl');
  if(tgl) tgl.onclick = ()=>{ sess.run=!sess.run; if(sess.run){segurarTela(true); tick();} else pararTimer(); render(); };
  const sk = document.getElementById('skip');
  if(sk) sk.onclick = ()=> avancar();
  if(sess && sess.run && !timer) tick();
};

function tick(){
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{
    if(!sess || !sess.run) return;
    sess.left--; sess.gasto++;
    if(sess.left<=0){ beep(880,.25); avancar(); return; }
    if(sess.left===3) beep(660,.1,.15);
    const c = document.getElementById('clk');
    if(c){
      c.textContent = mmss(sess.left);
      c.className = 'clock '+(sess.left<=5?'warn':'work');
      const bar = el.querySelector('.bar>i');
      if(bar) bar.style.width = (100 - sess.left/sess.steps[sess.i].s*100)+'%';
    } else { render(); }
  },1000);
}
function avancar(){
  if(!sess) return;
  if(sess.i>=sess.steps.length-1){
    pararTimer();
    registrar(sess.min, ['treino']);
    const m = sess.min; sess=null;
    el.innerHTML = `<div class="stack" style="text-align:center;padding-top:24px">
      <div style="font-size:52px">🥋</div>
      <h2 class="h-sec">Treino completo</h2>
      <p class="tiny">${m} minutos registrados no seu diário. Sequência: ${streak()} dia(s).</p>

      <button class="btn btn-ghost btn-block" data-go="diario">Ver o diário</button></div>`;
    return;
  }
  sess.i++; sess.left = sess.steps[sess.i].s;
  render();
}

  const sair = document.getElementById('sairSpar');

function sparTick(){
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{
    if(!spar || !spar.run) return;
    spar.left--; spar.gasto++;
    if(spar.left<=0){ sparFase(); return; }
    if(spar.left===10 && spar.fase==='luta') beep(660,.15,.18);
    const c=document.getElementById('sclk');
    if(c){
      c.textContent = mmss(spar.left);
      c.className='clock '+(spar.fase==='descanso'?'rest':(spar.left<=10?'warn':'work'));
      const total = spar.fase==='luta'?S.spar.work:S.spar.rest;
      const bar=el.querySelector('.bar>i'); if(bar) bar.style.width=(100-spar.left/total*100)+'%';
    } else render();
  },1000);
}
function sparFase(){
  if(!spar) return;
  if(spar.fase==='luta'){
    if(spar.round>=S.spar.rounds){
      beep(520,.5); pararTimer();
      const min = spar.gasto/60; const a=spar.a, b=spar.b;
      registrar(Math.max(1,min),['sparring']); spar=null;
      el.innerHTML=`<div class="stack" style="text-align:center;padding-top:24px">

      return;
    }
    spar.fase='descanso'; spar.left=S.spar.rest; beep(440,.35);
  } else {
    spar.fase='luta'; spar.round++; spar.left=S.spar.work; beep(880,.3);
  }
  render();
}

const FIG = {T:36, Lu:20, Lf:18, Lt:33, Ls:31, Lp:13, GY:62.7};
const rad = d => d*Math.PI/180;

const GUARDA = {t:-6, sh:-16, sk:16, sf:90, kh:14, kk:-6, kf:82, fa1:25, fa2:75, ba1:8, ba2:95, lift:0};
function P(o){ return Object.assign({}, GUARDA, o); }

/* frames: guarda -> câmara -> extensão. flip = corpo de costas para o alvo. */

function pontos(p){
  const t = rad(p.t||0);
  const neck = {x:FIG.T*Math.sin(t), y:-FIG.T*Math.cos(t)};
  const sho  = {x:0.84*FIG.T*Math.sin(t), y:-0.84*FIG.T*Math.cos(t)};
  const head = {x:neck.x+10*Math.sin(t), y:neck.y-10*Math.cos(t)};
  const perna=(h,k,f)=>{
    const a1=rad(h), a2=rad(h+k), a3=rad(h+k+f);
    const jo={x:FIG.Lt*Math.sin(a1), y:FIG.Lt*Math.cos(a1)};
    const to={x:jo.x+FIG.Ls*Math.sin(a2), y:jo.y+FIG.Ls*Math.cos(a2)};
    const pe={x:to.x+FIG.Lp*Math.sin(a3), y:to.y+FIG.Lp*Math.cos(a3)};
    return [{x:0,y:0},jo,to,pe];
  };
  const braco=(a,b)=>{
    const a1=rad(a), a2=rad(a+b);
    const co={x:sho.x+FIG.Lu*Math.sin(a1), y:sho.y+FIG.Lu*Math.cos(a1)};
    const ma={x:co.x+FIG.Lf*Math.sin(a2), y:co.y+FIG.Lf*Math.cos(a2)};
    return [sho,co,ma];
  };
  return {neck, sho, head,
    sup:perna(p.sh,p.sk,p.sf), chute:perna(p.kh,p.kk,p.kf),
    bF:braco(p.fa1,p.fa2), bB:braco(p.ba1,p.ba2), lift:p.lift||0};
}
const poly = a => a.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');

function svgBoneco(p, opt){
  opt = opt||{};
  const q = pontos(p);
  const alvo = opt.alvo ? `<circle cx="${q.chute[3].x.toFixed(1)}" cy="${q.chute[3].y.toFixed(1)}" r="14"
      fill="var(--red-soft)" stroke="var(--red)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".9"/>` : '';
  const fl = opt.flip ? ' scale(-1,1)' : '';
  return `<svg viewBox="-74 -95 178 175" width="100%" ${opt.h?`height="${opt.h}"`:''} role="img"
    aria-label="Desenho do movimento" style="display:block;overflow:visible">
    <line x1="-72" y1="${FIG.GY}" x2="102" y2="${FIG.GY}" stroke="var(--line)" stroke-width="2"/>
    <g transform="translate(0,${-q.lift})${fl}" fill="none" stroke-linecap="round" stroke-linejoin="round">
      ${alvo}
      <polyline points="${poly(q.bB)}" stroke="var(--ink-3)" stroke-width="4.5"/>
      <polyline points="${poly(q.sup)}" stroke="var(--ink-3)" stroke-width="6"/>
      <line x1="0" y1="0" x2="${q.neck.x.toFixed(1)}" y2="${q.neck.y.toFixed(1)}" stroke="var(--ink-2)" stroke-width="8"/>
      <circle cx="${q.head.x.toFixed(1)}" cy="${q.head.y.toFixed(1)}" r="9.5" fill="var(--surface)" stroke="var(--ink-2)" stroke-width="3.5"/>
      <polyline points="${poly(q.bF)}" stroke="var(--ink-2)" stroke-width="5"/>
      <polyline points="${poly(q.chute)}" stroke="var(--accent)" stroke-width="8"/>
      <circle cx="${q.chute[3].x.toFixed(1)}" cy="${q.chute[3].y.toFixed(1)}" r="3.6" fill="var(--accent)"/>
    </g>
  </svg>`;
}

const FASES = ['Guarda','Câmara','Extensão'];
function tira(nome){
  const m = MOV[nome]; if(!m) return '';
  return `<div class="tira">${m.f.map((p,i)=>`<div class="quadro">
    ${svgBoneco(p,{flip:m.flip, alvo:i===2})}
    <span class="qlb">${i+1}. ${FASES[i]}</span></div>`).join('')}</div>`;
}

function lerp(a,b,u){ const o={}; for(const k in a) o[k] = a[k] + (b[k]-a[k])*u; return o; }
let animRAF = null;
function animar(nome, box){
  const m = MOV[nome]; if(!m || !box) return;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){
    box.innerHTML = svgBoneco(m.f[2],{flip:m.flip, alvo:true}); return;
  }
  const roteiro = [[0,1,420],[1,2,260],[2,2,520],[2,1,300],[1,0,380],[0,0,420]];
  let etapa = 0, t0 = performance.now();
  cancelAnimationFrame(animRAF);
  const passo = now=>{
    const [a,b,dur] = roteiro[etapa];
    let u = (now-t0)/dur;
    if(u>=1){ u=1; etapa=(etapa+1)%roteiro.length; t0=now; }
    const e = u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;
    box.innerHTML = svgBoneco(lerp(m.f[a], m.f[b], e), {flip:m.flip, alvo:(b===2&&u>.6)});
    animRAF = requestAnimationFrame(passo);
  };
  animRAF = requestAnimationFrame(passo);
}

/* ---------- MÍDIA DO ALUNO (guardada no aparelho) ---------- */
let MDB = null, urlsAbertas = [];
function mdb(){
  return new Promise((res,rej)=>{
    if(MDB) return res(MDB);
    if(!window.indexedDB) return rej(new Error('sem indexedDB'));
    const r = indexedDB.open('dojang-midia',1);
    r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains('m')) r.result.createObjectStore('m',{keyPath:'id'}); };
    r.onsuccess = ()=>{ MDB=r.result; res(MDB); };
    r.onerror = ()=> rej(r.error);
  });
}
async function mListar(){
  try{
    const db = await mdb();
    return await new Promise(res=>{
      const q = db.transaction('m').objectStore('m').getAll();
      q.onsuccess = ()=> res((q.result||[]).sort((a,b)=>b.ts-a.ts));
      q.onerror = ()=> res([]);
    });
  }catch(e){ return []; }
}
async function mSalvar(o){
  const db = await mdb();
  return new Promise((res,rej)=>{
    const q = db.transaction('m','readwrite').objectStore('m').put(o);
    q.onsuccess = ()=>res(); q.onerror = ()=>rej(q.error);
  });
}
async function mApagar(id){
  const db = await mdb();
  return new Promise(res=>{
    const q = db.transaction('m','readwrite').objectStore('m').delete(id);
    q.onsuccess = ()=>res(); q.onerror = ()=>res();
  });
}
function soltarUrls(){ urlsAbertas.forEach(u=>{ try{URL.revokeObjectURL(u);}catch(e){} }); urlsAbertas=[]; }
function urlDe(blob){ const u = URL.createObjectURL(blob); urlsAbertas.push(u); return u; }

  inV.onchange = receber; inF.onchange = receber;

  el.querySelectorAll('[data-speed]').forEach(g=>{
    const vid = el.querySelector('video[data-vid="'+g.dataset.speed+'"]');
    g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      if(!vid) return;
      if(b.dataset.v==='loop'){ vid.loop=!vid.loop; b.classList.toggle('on',vid.loop); return; }
      vid.playbackRate = parseFloat(b.dataset.v);
      g.querySelectorAll('button[data-v]:not([data-v="loop"])').forEach(o=>o.classList.remove('on'));
      b.classList.add('on');
    });
  });
  el.querySelectorAll('video[data-vid]').forEach(v=>{
    v.onerror = async ()=>{
      const m = midias.find(x=>x.id===v.dataset.vid); if(!m || v.dataset.tentou) return;
      v.dataset.tentou='1';
      const fr = new FileReader();
      fr.onload = ()=>{ v.src = fr.result; };
      fr.readAsDataURL(m.blob);
    };
  });
  el.querySelectorAll('[data-del]').forEach(x=>x.onclick=async ()=>{
    if(!confirm('Apagar esta gravação do aparelho?')) return;
    await mApagar(x.dataset.del); midias = await mListar(); soltarUrls(); render();
  });
};

let quiz = null;
function novoQuiz(){
  const pool = [...TERMOS].sort(()=>Math.random()-0.5).slice(0,10);
  quiz = {q: pool.map(t=>{
    const erradas = TERMOS.filter(x=>x.p!==t.p).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.p);
    return {k:t.k, cert:t.p, ops:[t.p,...erradas].sort(()=>Math.random()-0.5)};
  }), i:0, acertos:0, escolha:null};
}
VIEWS.quiz = ()=>{
  if(!quiz) novoQuiz();
  if(quiz.i>=quiz.q.length){
    const n = quiz.acertos;
    return `<div class="stack" style="text-align:center;padding-top:20px">
      <div style="font-size:50px">${n>=9?'🏆':n>=7?'👊':'📖'}</div>

      <p class="tiny">${n>=9?'Isso é nível de exame.':n>=7?'Muito bom. Repassa as que errou.':'Volta na lista de palavras e tenta de novo.'}${n>S.quizBest?' Novo recorde!':''}</p>
      <button class="btn btn-primary btn-block" id="reQuiz">Jogar de novo</button>
      <button class="btn btn-ghost btn-block" data-go="termos">Ver a lista</button>
    </div>`;
  }
  const q = quiz.q[quiz.i];
  return `<div class="stack">
    <button class="back" data-go="termos">‹ Palavras</button>
    <div class="row" style="justify-content:space-between">
      <span class="chip chip-blue">${quiz.i+1} de 10</span>
      <span class="chip chip-pine">${quiz.acertos} certas</span>
    </div>
    <section class="card pad" style="text-align:center;padding:26px 14px">
      <div class="tiny">O que significa</div>
      <h2 class="h-sec" style="font-size:38px;color:var(--accent);margin-top:4px">${esc(q.k)}</h2>
    </section>
    <div class="stack-sm">
      ${q.ops.map((o,i)=>{
        let cls='opt';
        if(quiz.escolha!==null){
          if(o===q.cert) cls+=' ok';
          else if(o===quiz.escolha) cls+=' no';
        }
        return `<button class="${cls}" data-op="${i}">${esc(o)}</button>`;
      }).join('')}
    </div>
    ${quiz.escolha!==null?`<button class="btn btn-primary btn-block" id="nextQ">Próxima ›</button>`:''}
  </div>`;
};
AFTER.quiz = ()=>{
  el.querySelectorAll('[data-op]').forEach(x=>x.onclick=()=>{
    if(quiz.escolha!==null) return;
    const q = quiz.q[quiz.i];
    quiz.escolha = q.ops[+x.dataset.op];
    if(quiz.escolha===q.cert){ quiz.acertos++; beep(940,.12,.15); } else beep(320,.2,.15);
    render();
  });
  const nq = document.getElementById('nextQ');
  if(nq) nq.onclick = ()=>{
    quiz.i++; quiz.escolha=null;
    if(quiz.i>=quiz.q.length){
      S.quizJogos++; if(quiz.acertos>S.quizBest) S.quizBest=quiz.acertos; save();
    }
    render();
  };
  const rq = document.getElementById('reQuiz');
  if(rq) rq.onclick = ()=>{ novoQuiz(); render(); };
};

      <p style="font-family:var(--display);font-size:20px;font-weight:600;line-height:1.25">Quatro respirações lentas. Passa a forma inteira na cabeça. Entra sabendo o primeiro movimento.</p>
      <div class="tiny">Nervoso é normal e até ajuda — é o corpo se ligando. O que atrapalha é tentar consertar tudo na hora. Escolhe UMA coisa para lembrar e esquece o resto.</div>
    </section>
  </div>`;
};
AFTER.torneio = ()=>{
  el.querySelectorAll('[data-mala]').forEach(x=>x.onclick=()=>{
    if(x.dataset.mala==='zero') S.mala=[]; else { const i=+x.dataset.mala; S.mala=S.mala||[]; S.mala[i]=!S.mala[i]; }
    save(); render();
  });
};

/* ---------- DIÁRIO ---------- */
VIEWS.diario = ()=>{
  const dias=[]; const d=new Date();
  for(let i=13;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); dias.push(x.toISOString().slice(0,10)); }
  const porDia = dias.map(k=>S.sessoes.filter(s=>s.d===k).reduce((a,s)=>a+s.min,0));
  const max = Math.max(30,...porDia);
  const ultimos = [...S.sessoes].reverse().slice(0,12);
  const totalMin = S.sessoes.reduce((a,s)=>a+s.min,0);
  return `<div class="stack">
    <button class="back" data-go="mais">‹ Mais</button>
    <div><div class="eyebrow">Progresso</div><h2 class="h-sec" style="margin-top:6px">Diário de treino</h2></div>
    <div class="tiles">
      <div class="tile"><b>${streak()}</b><span>dias seguidos</span></div>
      <div class="tile"><b>${S.sessoes.length}</b><span>treinos</span></div>
      <div class="tile"><b>${Math.round(totalMin/60)}h</b><span>no total</span></div>
    </div>
    <section class="card pad">
      <div class="eyebrow" style="margin-bottom:10px">Últimos 14 dias · minutos</div>
      <div class="spark">${porDia.map(v=>`<div class="b ${v?'has':''}" style="height:${Math.max(3,v/max*100)}%" title="${v} min"></div>`).join('')}</div>
      <div class="spark-x"><span>${diaBR(dias[0])}</span><span>${diaBR(dias[13])}</span></div>
    </section>
    <section class="card pad stack-sm">
      <div class="eyebrow">Registrar um treino na aula</div>
      <div class="seg">${[30,45,60,90].map(n=>`<button data-add="${n}">${n} min</button>`).join('')}</div>
      <div class="tiny">Use depois da aula no dojang. Treinos feitos aqui dentro entram sozinhos.</div>
    </section>
    <section class="card pad">
      <div class="eyebrow" style="margin-bottom:6px">Histórico</div>
      ${ultimos.length? ultimos.map(s=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-soft)">
        <span style="font-weight:600;font-size:14.5px">${diaBR(s.d)}</span>
        <span class="tiny">${(s.t&&s.t.length?s.t.join(', '):'treino')}</span>
        <span class="chip chip-blue">${s.min} min</span></div>`).join('')
        : '<p class="tiny">Nenhum treino ainda. Toque em “Treinar agora” na aba Hoje.</p>'}
    </section>
  </div>`;
};
AFTER.diario = ()=>{
  el.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{ registrar(+x.dataset.add,['aula']); beep(880,.15); render(); });
};

/* ---------- DÚVIDAS (Claude) ---------- */
let sampleFn = null;
let chat = [];
const REGRAS = 'Você é um assistente de treino de Taekwondo respondendo a um aluno de 12 a 14 anos, faixa colorida da ATA (Songahm), em português do Brasil. Responda curto (no máximo 5 frases), direto, com linguagem simples e encorajadora. Dê instruções práticas que dá para fazer em casa com segurança. Nunca invente a sequência oficial de uma forma da ATA nem regras de pontuação de campeonato: nesses casos diga para confirmar com o instrutor. Se a pergunta for sobre dor, lesão ou perda de peso, mande falar com um adulto responsável e com o instrutor. Não fale sobre nada fora de treino, esporte e escola.';

VIEWS.duvidas = ()=>`<div class="stack">
  <button class="back" data-go="mais">‹ Mais</button>
  <div><div class="eyebrow">Tira-dúvidas</div><h2 class="h-sec" style="margin-top:6px">Pergunte sobre o treino</h2></div>
  <div class="stack-sm" id="chatBox">
    ${chat.length?chat.map(t=>`<div class="card pad" style="${t.role==='user'?'background:var(--accent-soft);border-color:transparent':''}">
      <div class="eyebrow" style="margin-bottom:5px">${t.role==='user'?'Você':'Resposta'}</div>
      <div style="font-size:14.5px;white-space:pre-wrap">${esc(t.content)}</div></div>`).join('')
      :`<div class="card pad stack-sm"><div class="tiny">Exemplos: “meu chute lateral fica torto, o que faço?”, “como parar de perder o equilíbrio no giro?”, “o que treinar nos 20 minutos antes de dormir?”</div></div>`}
  </div>
  <div class="card pad stack-sm">
    <textarea id="pergunta" rows="3" placeholder="Escreva sua dúvida…"></textarea>
    <button class="btn btn-primary btn-block" id="enviar">Perguntar</button>
    <div class="tiny" id="chatMsg"></div>
  </div>
  <p class="note">Resposta de um assistente automático. Para qualquer coisa sobre a sequência das formas, exame de faixa ou regra de campeonato, quem responde é o instrutor da ATA Londrina.</p>
</div>`;

AFTER.duvidas = ()=>{
  const box = document.getElementById('pergunta');
  const btn = document.getElementById('enviar');
  const msg = document.getElementById('chatMsg');
  if(!sampleFn){ btn.disabled=true; msg.textContent='Indisponível neste aparelho.'; return; }
  btn.onclick = async ()=>{
    const q = box.value.trim(); if(!q) return;
    chat.push({role:'user', content:q});
    box.value=''; btn.disabled=true;
    render();
    const holder = document.getElementById('chatBox');
    const bubble = document.createElement('div');
    bubble.className='card pad';
    bubble.innerHTML='<div class="eyebrow" style="margin-bottom:5px">Resposta</div><div style="font-size:14.5px;white-space:pre-wrap" id="live">Pensando…</div>';
    holder.appendChild(bubble);
    const live = document.getElementById('live');
    try{
      const turnos = [{role:'user', content:REGRAS}, ...chat.slice(-6)];
      const {text} = await sampleFn(turnos, {cache:false, modelTier:'quick', onText:({text})=>{ live.textContent = text; }});
      chat.push({role:'assistant', content:text});
    }catch(e){
      const c = e && e.code;
      chat.push({role:'assistant', content: c==='not_granted' ? 'Não deu para perguntar agora — o acesso não foi liberado neste aparelho.' : c==='rate_limited' ? 'Muitas perguntas de uma vez. Espere um minuto e tente de novo.' : 'Não consegui responder agora. Tente de novo daqui a pouco.'});
    }
    render();
    const b2 = document.getElementById('enviar'); if(b2) b2.disabled=false;
  };
};

/* ---------- AJUSTES ---------- */
VIEWS.ajustes = ()=>`<div class="stack">
  <button class="back" data-go="mais">‹ Mais</button>
  <div><div class="eyebrow">Configuração</div><h2 class="h-sec" style="margin-top:6px">Ajustes</h2></div>
  <section class="card pad stack-sm">
    <div class="eyebrow">Nome</div>
    <input type="text" id="nomeIn" value="${esc(S.nome)}" maxlength="18">
  </section>
  <section class="card pad stack-sm">
    <div class="eyebrow">Faixa</div>
    <div class="tiny">Mude na aba “Escada de faixas”, tocando na cor.</div>
    <button class="btn btn-ghost btn-block" data-go="faixas">Abrir a escada</button>
  </section>
  <section class="card pad stack-sm">
    <div class="eyebrow">Tema</div>
    <div class="seg">
      <button data-tema="" class="${!S.tema?'on':''}">Automático</button>
      <button data-tema="light" class="${S.tema==='light'?'on':''}">Claro</button>
      <button data-tema="dark" class="${S.tema==='dark'?'on':''}">Escuro</button>
    </div>
  </section>
  <section class="card pad stack-sm">
    <div class="eyebrow">Dados</div>
    <div class="tiny">Tudo fica salvo só neste aparelho — voltas, diário, anotações e recordes. Nada sai daqui.</div>
    <button class="btn btn-ghost btn-block" id="apagar" style="color:var(--red);border-color:var(--red)">Apagar tudo e começar de novo</button>
  </section>
  <p class="tiny" style="text-align:center;padding:10px 0">Dojang de Bolso · feito para o ${esc(S.nome)} · ATA Londrina</p>
</div>`;
AFTER.ajustes = ()=>{
  const n=document.getElementById('nomeIn');
  n.oninput=()=>{ S.nome=n.value||'Felipe'; save(); document.getElementById('uname').textContent=S.nome; };
  el.querySelectorAll('[data-tema]').forEach(x=>x.onclick=()=>{
    S.tema = x.dataset.tema||null; aplicarTema(); save(); render();
  });
  document.getElementById('apagar').onclick=()=>{
    if(confirm('Apagar todo o progresso deste aparelho?')){
      try{ localStorage.removeItem(KEY); }catch(e){}
      S = JSON.parse(JSON.stringify(DEF)); aplicarTema(); go('hoje');
    }
  };
};

function aplicarTema(){
  if(S.tema) document.documentElement.setAttribute('data-theme', S.tema);
  else document.documentElement.removeAttribute('data-theme');
}

/* ============================ EVENTOS ============================ */
document.addEventListener('click', e=>{
  const nv = e.target.closest('[data-nav]');
  if(nv){ go(nv.dataset.nav); return; }
  const pv = e.target.closest('[data-play]');
  if(pv){ tocando = pv.dataset.play; render(); return; }
  const g = e.target.closest('[data-go]');
  if(g && el.contains(g)){
    if(g.tagName==='A') return;
    const d = g.dataset.go, i = d.indexOf(':');
    if(i<0) go(d); else go(d.slice(0,i), d.slice(i+1));
  }
});
document.getElementById('beltBtn').onclick = ()=> go('faixas');
document.getElementById('streakBox').onclick = ()=> go('diario');

aplicarTema();
render();

(async ()=>{
  try{
    if(window.claude && window.claude.use){
      const s = await window.claude.use('sample');
      if(s){ sampleFn = s; if(R.v==='mais') render(); }
    }
  }catch(e){}
})();
</script>
